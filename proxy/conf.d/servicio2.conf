server {
    listen 80;
    server_name servicio2.midominio.local;
    return 301 https://$host$request_uri; # Redirección a HTTPS
}

server {
    listen 443 ssl;
    server_name servicio2.midominio.local;

    ssl_certificate /etc/nginx/ssl/certificado.crt;
    ssl_certificate_key /etc/nginx/ssl/certificado.key;

    location / {
        proxy_pass http://10.8.66.235:8082; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}